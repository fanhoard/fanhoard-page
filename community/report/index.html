        emailPlaceholder: 'you@example.com',
        errCategory: '\u0E01\u0E23\u0E38\u0E13\u0E32\u0E40\u0E25\u0E37\u0E2D\u0E01\u0E1B\u0E23\u0E30\u0E40\u0E20\u0E17\u0E1B\u0E31\u0E0D\u0E2B\u0E32',
        errDetails: '\u0E01\u0E23\u0E38\u0E13\u0E32\u0E2D\u0E18\u0E34\u0E1A\u0E32\u0E22\u0E1B\u0E31\u0E0D\u0E2B\u0E32',

        errorBody: '\u0E44\u0E21\u0E48\u0E2A\u0E32\u0E21\u0E32\u0E23\u0E16\u0E2A\u0E48\u0E07\u0E23\u0E32\u0E22\u0E07\u0E32\u0E19\u0E44\u0E14\u0E49 \u0E01\u0E23\u0E38\u0E13\u0E32\u0E15\u0E23\u0E27\u0E08\u0E2A\u0E2D\u0E1A\u0E01\u0E32\u0E23\u0E40\u0E00\u0E37\u0E48\u0E2D\u0E21\u0E15\u0E48\u0E2D\u0E41\u0E25\u0E49\u0E27\u0E25\u0E2D\u0E07\u0E43\u0E2B\u0E21\u0E48'
      }
    };

    /* ══════════════════════════════════════════════
       STATE & HELPERS
       ══════════════════════════════════════════════ */
    var currentLang = 'en';
    var currentVersion = VERSION_FALLBACK;

    function getTranslations() {
      return UI_STRINGS[currentLang] || UI_STRINGS.en;
    }

    function getLangLabel() {
      return currentLang === 'th' ? 'th' : 'en';
    }

    /* Detect device type */
    function detectDevice() {
      var ua = navigator.userAgent;
      if (/eReader|Kindle|Kobo|Book/i.test(ua)) return 'E-Reader';
      if (/Mobile|Android|iP(hone|od)/i.test(ua)) return 'Mobile';
      if (/Tablet|iPad/i.test(ua)) return 'Tablet';
      return 'Desktop';
    }

    /* Fetch current app version */
    async function fetchVersion() {
      try {
        var res = await fetch('/assets/json/version.json');
        if (res.ok) {
          var data = await res.json();
          if (data.version) currentVersion = data.version;
        }
      } catch (_) { /* use fallback */ }
    }

    /* ══════════════════════════════════════════════
       POPULATE DROPDOWNS
       ══════════════════════════════════════════════ */

    function populateSelect(selectId, items, placeholderText) {
      var sel = document.getElementById(selectId);
      if (!sel) return;
      var curVal = sel.value;

      sel.innerHTML = '';

      /* Placeholder option */
      var opt0 = document.createElement('option');
      opt0.value = '';
      opt0.disabled = true;
      opt0.selected = !curVal;
      opt0.textContent = placeholderText;
      sel.appendChild(opt0);

      items.forEach(function(item) {
        var opt = document.createElement('option');
        opt.value = item.value;
        opt.textContent = typeof item.label === 'object'
          ? (item.label[currentLang] || item.label.en)
          : item.label;
        if (item.value === curVal) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function updateDropdowns() {
      var t = getTranslations();

      populateSelect('report-category', CATEGORIES, t.selectPlaceholder);
      populateSelect('report-page', PAGES, t.selectPlaceholder);
      populateSelect('report-browser', BROWSERS, t.selectPlaceholder);

      /* Placeholders */
      document.getElementById('report-details').placeholder = t.detailsPlaceholder;
      document.getElementById('report-expected').placeholder = t.expectedPlaceholder;
      document.getElementById('report-email').placeholder = t.emailPlaceholder;
      document.getElementById('report-page-custom').placeholder = t.customPagePlaceholder;

      /* Submit button label */
      var btn = document.getElementById('report-submit');
      if (!btn.disabled) {
        btn.textContent = t.submitBtn;
      }
    }

    /* ══════════════════════════════════════════════
       PAGE CUSTOM FIELD TOGGLE
       ══════════════════════════════════════════════ */

    function handlePageSelect() {
      var sel = document.getElementById('report-page');
      var customInput = document.getElementById('report-page-custom');
      if (sel.value === '__other__') {
        customInput.classList.add('visible');
        customInput.required = true;
        customInput.focus();
      } else {
        customInput.classList.remove('visible');
        customInput.required = false;
        customInput.value = '';
      }
      clearError('page');
    }

    /* ══════════════════════════════════════════════
       VALIDATION
       ══════════════════════════════════════════════ */

    function showError(fieldKey, message) {
      var errEl = document.getElementById('error-' + fieldKey);
      if (errEl) {
        errEl.textContent = message;
        errEl.classList.add('visible');
      }

      var fieldEl;
      if (fieldKey === 'category') fieldEl = document.getElementById('report-category');
      else if (fieldKey === 'details') fieldEl = document.getElementById('report-details');
      else if (fieldKey === 'page') {
        var pageSel = document.getElementById('report-page');
        fieldEl = pageSel.value === '__other__'
          ? document.getElementById('report-page-custom')
          : pageSel;
      }

      if (fieldEl) fieldEl.classList.add('report-field-error');
    }

    function clearError(fieldKey) {
      var errEl = document.getElementById('error-' + fieldKey);
      if (errEl) {
        errEl.textContent = '';
        errEl.classList.remove('visible');
      }

      var fieldEl;
      if (fieldKey === 'category') fieldEl = document.getElementById('report-category');
      else if (fieldKey === 'details') fieldEl = document.getElementById('report-details');
      else if (fieldKey === 'page') {
        document.getElementById('report-page').classList.remove('report-field-error');
        document.getElementById('report-page-custom').classList.remove('report-field-error');
        return;
      }

      if (fieldEl) fieldEl.classList.remove('report-field-error');
    }

    function clearAllErrors() {
      ['category', 'details', 'page'].forEach(clearError);
    }

    function validateForm() {
      clearAllErrors();
      var t = getTranslations();
      var valid = true;

      var category = document.getElementById('report-category').value;
      if (!category) {
        showError('category', t.errCategory);
        valid = false;
      }

      var details = document.getElementById('report-details').value.trim();
      if (!details) {
        showError('details', t.errDetails);
        valid = false;
      }

      var pageSel = document.getElementById('report-page').value;
      if (!pageSel) {
        showError('page', t.errPage);
        valid = false;
      } else if (pageSel === '__other__') {
        var customVal = document.getElementById('report-page-custom').value.trim();
        if (!customVal) {
          showError('page', t.errPage);
          valid = false;
        }
      }

      if (!valid) {
        var firstErr = document.querySelector('.report-field-error');
        if (firstErr) firstErr.focus();
      }

      return valid;
    }

    /* ══════════════════════════════════════════════
       SUBMIT HANDLER
       ══════════════════════════════════════════════ */

    function getFormData() {
      var pageSel = document.getElementById('report-page').value;
      var page = pageSel === '__other__'
        ? document.getElementById('report-page-custom').value.trim()
        : pageSel;

      var categoryVal = document.getElementById('report-category').value;

      return {
        categoryKey: categoryVal,
        page: page,
        language: getLangLabel(),
        version: currentVersion,
        device: detectDevice(),
        browser: document.getElementById('report-browser').value,
        message: document.getElementById('report-details').value.trim(),
        expected: document.getElementById('report-expected').value.trim(),
        email: document.getElementById('report-email').value.trim()
      };
    }

    function setSubmitLoading(loading) {
      var btn = document.getElementById('report-submit');
      var t = getTranslations();
      btn.disabled = loading;
      btn.textContent = loading ? t.submitting : t.submitBtn;
    }

    function showPopup(title, body) {
      if (window.PopupSystem && window.PopupSystem.open) {
        PopupSystem.open({
          title: title,
          body: '<p style="text-align:center;margin:0;">' + body + '</p>',
          size: 'sm',
          showHeader: true,
          hideOnBack: true
        });
      } else {
        alert(title + '\n' + body);
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      if (!validateForm()) return;

      var t = getTranslations();
      setSubmitLoading(true);
      if (window.announceToScreenReader) {
        window.announceToScreenReader(currentLang === "th" ? "กำลังส่งรายงาน…" : "Submitting report…", "polite");
      }

      var data = getFormData();

      try {
        var resp = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (!resp.ok) {
          var errData = {};
          try { errData = await resp.json(); } catch (_) {}
          throw new Error(errData.error || 'HTTP ' + resp.status);
        }

        document.getElementById('report-form').reset();
        updateDropdowns();
        if (window.announceToScreenReader) {
          window.announceToScreenReader(currentLang === "th" ? "ส่งรายงานสำเร็จเรียบร้อยแล้ว" : "Report submitted successfully.", "polite");
        }
        showPopup(t.successTitle, t.successBody);
      } catch (err) {
        console.error('[report] Submit failed:', err);
        if (window.announceToScreenReader) {
          window.announceToScreenReader(currentLang === "th" ? "เกิดข้อผิดพลาดในการส่งรายงาน" : "Failed to submit report.", "assertive");
        }
        showPopup(t.errorTitle, t.errorBody);
      } finally {
        setSubmitLoading(false);
      }
    }

    /* ══════════════════════════════════════════════
       LANGUAGE CHANGE HANDLER
       ══════════════════════════════════════════════ */

    function onLangChange() {
      if (window.FvLang) {
        currentLang = window.FvLang.lang || 'en';
      }
      updateDropdowns();
    }

    /* ══════════════════════════════════════════════
       INIT
       ══════════════════════════════════════════════ */

    function init() {
      if (window.FvLang) {
        currentLang = window.FvLang.lang || 'en';
      }

      updateDropdowns();

      document.getElementById('report-page').addEventListener('change', handlePageSelect);
      document.getElementById('report-form').addEventListener('submit', handleSubmit);

      document.addEventListener('fv:langchange', onLangChange);
      if (window.FvLang && window.FvLang.onChange) {
        window.FvLang.onChange(onLangChange);
      }

      fetchVersion();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>

</body>
</html>
