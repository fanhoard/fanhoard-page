  (function() {
    'use strict';

    /* ══════════════════════════════════════════════

       ══════════════════════════════════════════════ */
    var API_ENDPOINT = 'https://community.nontakorn2600.workers.dev/report';
    var VERSION_FALLBACK = '1.6.2_2';

    /* ── Issue categories ── */
    var CATEGORIES = [
      { value: 'bug',            label: { en: '\u{1F41B} Bug',                   th: '\u{1F41B} \u0E1A\u0E31\u0E4A\u0E01' } },
      { value: 'translation',    label: { en: '\u{1F310} Translation Issue',      th: '\u{1F310} \u0E1B\u0E31\u0E0D\u0E2B\u0E32\u0E01\u0E32\u0E23\u0E41\u0E1B\u0E25' } },

      { value: 'mobile-ui',      label: { en: '\u{1F4F1} Mobile UI Issue',        th: '\u{1F4F1} \u0E1B\u0E31\u0E0D\u0E2B\u0E32 UI \u0E1A\u0E19\u0E21\u0E37\u0E2D\u0E16\u0E37\u0E2D' } },
      { value: 'performance',    label: { en: '\u{26A1} Performance Issue',       th: '\u{26A1} \u0E1B\u0E31\u0E0D\u0E2B\u0E32\u0E1B\u0E23\u0E30\u0E2A\u0E34\u0E17\u0E18\u0E34\u0E20\u0E32\u0E1E' } },
      { value: 'incorrect-info', label: { en: '\u{1F4C4} Incorrect Information',  th: '\u{1F4C4} \u0E02\u0E49\u0E2D\u0E21\u0E39\u0E25\u0E44\u0E21\u0E48\u0E16\u0E39\u0E01\u0E15\u0E49\u0E2D\u0E07' } },
      { value: 'suggestion',     label: { en: '\u{1F4A1} Suggestion',             th: '\u{1F4A1} \u0E02\u0E49\u0E2D\u0E40\u0E2A\u0E19\u0E2D\u0E41\u0E19\u0E30' } },
      { value: 'other',          label: { en: '\u{2753} Other',                   th: '\u{2753} \u0E2D\u0E37\u0E48\u0E19\u0E46' } }
    ];

    /* ── Site pages ── */
    var PAGES = [
      { value: '/home/',                label: { en: 'Home',            th: '\u0E2B\u0E19\u0E49\u0E32\u0E2B\u0E25\u0E31\u0E01' } },
      { value: '/platform/about/',      label: { en: 'About',           th: '\u0E40\u0E01\u0E35\u0E48\u0E22\u0E27\u0E01\u0E31\u0E1A' } },
      { value: '/platform/whats_new/',  label: { en: "What's New",      th: '\u0E2D\u0E30\u0E44\u0E23\u0E43\u0E2B\u0E21\u0E48' } },
      { value: '/platform/roadmap/',    label: { en: 'Roadmap',         th: '\u0E41\u0E1C\u0E19\u0E07\u0E32\u0E19' } },
      { value: '/platform/privacy/',    label: { en: 'Privacy Policy',  th: '\u0E19\u0E42\u0E22\u0E1A\u0E32\u0E22\u0E04\u0E27\u0E32\u0E21\u0E40\u0E1B\u0E47\u0E19\u0E2A\u0E48\u0E27\u0E19\u0E15\u0E31\u0E27' } },
      { value: '/platform/license/',    label: { en: 'Content License', th: '\u0E2A\u0E31\u0E0D\u0E0D\u0E32\u0E2D\u0E19\u0E38\u0E0D\u0E32\u0E15\u0E40\u0E19\u0E37\u0E49\u0E2D\u0E2B\u0E32' } },
      { value: '/community/contact/',   label: { en: 'Contact',         th: '\u0E15\u0E34\u0E14\u0E15\u0E48\u0E2D' } },
      { value: '/data/verse/discover/', label: { en: 'Verse Discover',  th: 'Verse \u0E04\u0E49\u0E19\u0E1E\u0E1A' } },
      { value: '/data/verse/scope/',    label: { en: 'Verse Scope',     th: 'Verse \u0E02\u0E2D\u0E1A\u0E40\u0E02\u0E15' } },
      { value: '/setting/',             label: { en: 'Settings',        th: '\u0E15\u0E31\u0E49\u0E07\u0E04\u0E48\u0E32' } },
      { value: '/search/',              label: { en: 'Search',          th: '\u0E04\u0E49\u0E19\u0E2B\u0E32' } },
      { value: 'custom',                label: { en: 'Other / Specific URL', th: '\u0E2D\u0E37\u0E48\u0E19\u0E46 / URL \u0E40\u0E09\u0E1E\u0E32\u0E30' } }
    ];

    /* ── Common Browsers ── */
    var BROWSERS = [
      { value: 'chrome-desktop',  label: 'Chrome (Desktop)' },
      { value: 'safari-desktop',  label: 'Safari (Desktop)' },
      { value: 'firefox-desktop', label: 'Firefox (Desktop)' },
      { value: 'edge-desktop',    label: 'Edge (Desktop)' },
      { value: 'safari-ios',      label: 'Safari (iPhone / iPad)' },
      { value: 'chrome-android',  label: 'Chrome (Android)' },
      { value: 'samsung-internet',label: 'Samsung Internet' },
      { value: 'other',           label: { en: 'Other', th: '\u0E2D\u0E37\u0E48\u0E19\u0E46' } }
    ];

    /* ══════════════════════════════════════════════
       HELPERS
       ══════════════════════════════════════════════ */
    function getLang() {
      var m = location.pathname.match(/^\/(th|en)(\/|$)/);
      if (m) return m[1];
      return localStorage.getItem('selectedLang') || localStorage.getItem('fv_lang') || 'en';
    }

    function populateSelect(selectEl, items) {
      var lang = getLang();
      items.forEach(function(item) {
        var opt = document.createElement('option');
        opt.value = item.value;
        if (typeof item.label === 'object') {
          opt.textContent = item.label[lang] || item.label.en;
        } else {
          opt.textContent = item.label;
        }
        selectEl.appendChild(opt);
      });
    }

    function getAppVersion() {
      if (window.FANHOARD_VERSION && window.FANHOARD_VERSION.VERSION) {
        return window.FANHOARD_VERSION.VERSION;
      }
      return VERSION_FALLBACK;
    }

    function detectUserAgent() {
      var ua = navigator.userAgent;
      if (/iPhone|iPad|iPod/.test(ua) && /Safari/.test(ua)) return 'safari-ios';
      if (/Android/.test(ua) && /Chrome/.test(ua)) return 'chrome-android';
      if (/SamsungBrowser/.test(ua)) return 'samsung-internet';
      if (/Chrome/.test(ua)) return 'chrome-desktop';
      if (/Safari/.test(ua)) return 'safari-desktop';
      if (/Firefox/.test(ua)) return 'firefox-desktop';
      if (/Edg/.test(ua)) return 'edge-desktop';
      return 'other';
    }

    /* ══════════════════════════════════════════════
       VALIDATION
       ══════════════════════════════════════════════ */
    function clearErrors() {
      var errorEls = document.querySelectorAll('.report-error-text');
      errorEls.forEach(function(el) {
        el.textContent = '';
        el.classList.remove('visible');
      });
      var fieldEls = document.querySelectorAll('.report-field-error');
      fieldEls.forEach(function(el) {
        el.classList.remove('report-field-error');
        el.setAttribute('aria-invalid', 'false');
        el.removeAttribute('aria-describedby');
      });
    }

    function showError(fieldId, errorId, msgEn, msgTh) {
      var lang = getLang();
      var msg = lang === 'th' ? msgTh : msgEn;
      var field = document.getElementById(fieldId);
      var errEl = document.getElementById(errorId);
      if (field) {
        field.classList.add('report-field-error');
        field.setAttribute('aria-invalid', 'true');
        field.setAttribute('aria-describedby', errorId);
      }
      if (errEl) {
        errEl.textContent = msg;
        errEl.classList.add('visible');
      }
    }

    function validateForm() {
      clearErrors();
      var valid = true;
      var firstInvalidEl = null;

      var category = document.getElementById('report-category').value;
      if (!category) {
        showError('report-category', 'error-category',
          'Please select an issue category.',
          '\u0E01\u0E23\u0E38\u0E13\u0E32\u0E40\u0E25\u0E37\u0E2D\u0E01\u0E2B\u0E21\u0E27\u0E14\u0E2B\u0E21\u0E39\u0E48\u0E1B\u0E31\u0E0D\u0E2B\u0E32');
        valid = false;
        if (!firstInvalidEl) firstInvalidEl = document.getElementById('report-category');
      }

      var details = document.getElementById('report-details').value.trim();
      if (!details) {
        showError('report-details', 'error-details',
          'Please describe the problem details.',
          '\u0E01\u0E23\u0E38\u0E13\u0E32\u0E23\u0E30\u0E1A\u0E38\u0E23\u0E32\u0E22\u0E25\u0E30\u0E40\u0E2D\u0E35\u0E22\u0E14\u0E1B\u0E31\u0E0D\u0E2B\u0E32');
        valid = false;
        if (!firstInvalidEl) firstInvalidEl = document.getElementById('report-details');
      }

      var pageVal = document.getElementById('report-page').value;
      if (!pageVal) {
        showError('report-page', 'error-page',
          'Please select the page where the issue occurred.',
          '\u0E01\u0E23\u0E38\u0E13\u0E32\u0E40\u0E25\u0E37\u0E2D\u0E01\u0E2B\u0E19\u0E49\u0E32\u0E17\u0E35\u0E48\u0E1E\u0E1A\u0E1B\u0E31\u0E0D\u0E2B\u0E32');
        valid = false;
        if (!firstInvalidEl) firstInvalidEl = document.getElementById('report-page');
      } else if (pageVal === 'custom') {
        var customPage = document.getElementById('report-page-custom').value.trim();
        if (!customPage) {
          showError('report-page-custom', 'error-page',
            'Please specify the page URL or name.',
            '\u0E01\u0E23\u0E38\u0E13\u0E32\u0E23\u0E30\u0E1A\u0E38 URL \u0E2B\u0E23\u0E37\u0E2D\u0E0A\u0E37\u0E48\u0E2D\u0E2B\u0E19\u0E49\u0E32');
          valid = false;
          if (!firstInvalidEl) firstInvalidEl = document.getElementById('report-page-custom');
        }
      }

      if (firstInvalidEl) {
        firstInvalidEl.focus();
      }

      return valid;
    }

    /* ══════════════════════════════════════════════
       SUBMISSION
       ══════════════════════════════════════════════ */
    function handleSubmit(e) {
      e.preventDefault();

      if (!validateForm()) return;

      var submitBtn = document.getElementById('report-submit');
      var origText = submitBtn.textContent;
      var lang = getLang();

      submitBtn.disabled = true;
      submitBtn.textContent = lang === 'th' ? '\u0E01\u0E33\u0E25\u0E31\u0E07\u0E2A\u0E48\u0E07...' : 'Submitting…';

      var category = document.getElementById('report-category').value;
      var details  = document.getElementById('report-details').value.trim();
      var expected = document.getElementById('report-expected').value.trim();
      var pageVal  = document.getElementById('report-page').value;
      var customPage = document.getElementById('report-page-custom').value.trim();
      var browser  = document.getElementById('report-browser').value;
      var email    = document.getElementById('report-email').value.trim();

      var finalPage = pageVal === 'custom' ? customPage : pageVal;

      var categorySelect = document.getElementById('report-category');
      var categoryLabel = categorySelect.options[categorySelect.selectedIndex] ? categorySelect.options[categorySelect.selectedIndex].text : category;

      var payload = {
        category: categoryLabel,
        message: details,
        expectedBehavior: expected,
        pageUrl: finalPage,
        browser: browser,
        email: email,
        userAgent: detectUserAgent(),
        appVersion: getAppVersion(),
        timestamp: new Date().toISOString()
      };

      fetch(API_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(function(res) {
        if (res.ok) {
          showSuccessPopup(lang);
          document.getElementById('report-form').reset();
          clearErrors();
        } else {
          showErrorPopup(lang, res.status);
        }
      })
      .catch(function() {
        showErrorPopup(lang, 0);
      })
      .finally(function() {
        submitBtn.disabled = false;
        submitBtn.textContent = origText;
      });
    }

    function showSuccessPopup(lang) {
      var title = lang === 'th' ? '\u0E2A\u0E48\u0E07\u0E23\u0E32\u0E22\u0E07\u0E32\u0E19\u0E2A\u0E33\u0E40\u0E23\u0E47\u0E08' : 'Report Sent!';
      var body  = lang === 'th'
        ? '\u0E02\u0E2D\u0E1A\u0E04\u0E38\u0E13\u0E2A\u0E33\u0E2B\u0E23\u0E31\u0E1A\u0E02\u0E49\u0E2D\u0E21\u0E39\u0E25 \u0E17\u0E35\u0E48\u0E21\u0E07\u0E32\u0E19\u0E08\u0E30\u0E19\u0E33\u0E44\u0E1B\u0E1B\u0E23\u0E31\u0E1A\u0E1B\u0E23\u0E38\u0E07 QuickHoard \u0E15\u0E48\u0E2D\u0E44\u0E1B'
        : 'Thank you for helping us improve QuickHoard! Our team has received your report.';

      if (window.showPopup) {
        window.showPopup({ title: title, message: body });
      } else {
        alert(title + '\n\n' + body);
      }
    }

    function showErrorPopup(lang, status) {
      var title = lang === 'th' ? '\u0E40\u0E01\u0E34\u0E14\u0E02\u0E49\u0E2D\u0E1C\u0E34\u0E14\u0E1E\u0E25\u0E32\u0E14' : 'Submission Failed';
      var body = '';

      if (status === 400) {
        body = lang === 'th'
          ? '\u0E02\u0E49\u0E2D\u0E21\u0E39\u0E25\u0E43\u0E19\u0E1F\u0E2D\u0E23\u0E4C\u0E21\u0E44\u0E21\u0E48\u0E16\u0E39\u0E01\u0E15\u0E49\u0E2D\u0E07 \u0E0D\u0E23\u0E14\u0E15\u0E23\u0E20\u0E08\u0E2A\u0E2D\u0E1A\u0E41\u0E25\u0E30\u0E01\u0E23\u0E2D\u0E01\u0E2D\u0E35\u0E01\u0E04\u0E23\u0E31\u0E49\u0E07'
          : 'Some details in the form are not valid. Please check them and try again.';
      } else {
        body = lang === 'th'
          ? '\u0E44\u0E21\u0E48\u0E2A\u0E32\u0E21\u0E32\u0E23\u0E16\u0E15\u0E34\u0E14\u0E15\u0E48\u0E2D\u0E40\u0E0B\u0E34\u0E23\u0E4C\u0E1F\u0E40\u0E27\u0E2D\u0E23\u0E4C\u0E44\u0E14\u0E49 \u0E01\u0E23\u0E38\u0E13\u0E32\u0E15\u0E23\u0E20\u0E08\u0E2A\u0E2D\u0E1A\u0E01\u0E22\u0E23\u0E40\u0E0A\u0E37\u0E48\u0E2D\u0E21\u0E15\u0E48\u0E2D\u0E41\u0E25\u0E49\u0E27\u0E25\u0E2D\u0E07\u0E2D\u0E35\u0E01\u0E04\u0E23\u0E31\u0E49\u0E07'
          : 'Could not reach the report server. Please check your connection and try again.';
      }

      if (window.showPopup) {
        window.showPopup({ title: title, message: body });
      } else {
        alert(title + '\n\n' + body);
      }
    }

    /* ══════════════════════════════════════════════
       INIT
       ══════════════════════════════════════════════ */
    document.addEventListener('DOMContentLoaded', function() {
      var categorySelect = document.getElementById('report-category');
      var pageSelect     = document.getElementById('report-page');
      var browserSelect  = document.getElementById('report-browser');
      var customPageInp  = document.getElementById('report-page-custom');

      populateSelect(categorySelect, CATEGORIES);
      populateSelect(pageSelect, PAGES);
      populateSelect(browserSelect, BROWSERS);

      function refreshSelects() {
        if (categorySelect) {
          var curCat = categorySelect.value;
          categorySelect.innerHTML = '<option value="" disabled data-translate="report-select-placeholder">Select a category…</option>';
          populateSelect(categorySelect, CATEGORIES);
          categorySelect.value = curCat;
        }
        if (pageSelect) {
          var curPage = pageSelect.value;
          pageSelect.innerHTML = '<option value="" disabled data-translate="report-select-placeholder">Select a page…</option>';
          populateSelect(pageSelect, PAGES);
          pageSelect.value = curPage;
        }
        if (browserSelect) {
          var curBrowser = browserSelect.value;
          browserSelect.innerHTML = '<option value="" disabled data-translate="report-select-placeholder">Select a browser…</option>';
          populateSelect(browserSelect, BROWSERS);
          browserSelect.value = curBrowser;
        }
      }
      window.addEventListener('fv:langchange', refreshSelects);
      window.addEventListener('languageChange', refreshSelects);

      /* Auto-select browser */
      var detectedBrowser = detectUserAgent();
      if (detectedBrowser && browserSelect) {
        browserSelect.value = detectedBrowser;
      }

      /* Toggle custom page field */
      pageSelect.addEventListener('change', function() {
        if (pageSelect.value === 'custom') {
          customPageInp.classList.add('visible');
          customPageInp.focus();
        } else {
          customPageInp.classList.remove('visible');
          customPageInp.value = '';
        }
      });

      /* Form submission handler */
      var form = document.getElementById('report-form');
      if (form) {
        form.addEventListener('submit', handleSubmit);
      }
    });

  })();
  </script>
</body>
</html>
