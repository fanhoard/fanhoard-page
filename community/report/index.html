<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="assets/js/lang-proxy.js?v=1.0.0-20250322"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-translate="page-report">Report an Issue</title>
  <meta name="description" content="Report a bug, issue, or suggestion to help improve FanHoard.">
  <meta name="theme-color" content="#0d9488" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" type="image/x-icon" href="/assets/images/fanhoard-verse360.ico" />

  <!-- 1. Tokens -->
  <link rel="preload" href="/assets/css/tokens.css" as="style">
  <link rel="stylesheet" href="/assets/css/tokens.css">

  <!-- 2. CSS -->
  <link rel="preload" href="/assets/css/setting.css?v=1.0.0-20250322" as="style" onload="this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="/assets/css/setting.css?v=1.0.0-20250322" /></noscript>
  <link rel="preload" href="/assets/css/bg.css?v=1.0.0-20250322" as="style" onload="this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="/assets/css/bg.css?v=1.0.0-20250322" /></noscript>
  <link rel="stylesheet" href="/assets/css/top-navigation-bar.css?v=1.0.0-20250322" media="all" />
  <link rel="stylesheet" href="/assets/css/report.css?v=1.6.2_2" media="all" />
</head>

<body>

  <a href="#fv-main" class="skip-link fv-skip-link">Skip to main content</a>

  <div id="fv-app" class="fv-app fv-page-shell fv-page-shell--has-top-nav" data-page="report">

    <!-- Top Navigation Header with Back Button -->
    <header class="fv-header" role="banner">
      <nav class="fv-nav" role="navigation" aria-label="Page navigation">
        <button class="back-button" id="back-button" aria-label="Go back">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="m15 19-7-7 7-7" />
          </svg>
        </button>
        <span class="page-title" data-translate="page-report">Report an Issue</span>
      </nav>
    </header>

    <h1 class="fv-sr-only" data-translate="page-report">Report an Issue</h1>

    <!-- Main Landmark -->
    <main id="fv-main" class="fv-main" role="main" tabindex="-1">
      <div class="container-md stack-md">

        <section class="fv-section fv-card con">
          <p class="fv-section-label" data-translate="report-new-title">Report an Issue</p>
          <p class="report-desc" data-translate="report-new-desc">Found a bug or have a suggestion? Let us know so we can improve FanHoard.</p>
        </section>

        <section class="fv-section fv-card pad">
          <form id="report-form" class="stack-md" novalidate>

            <!-- Issue Type -->
            <div class="setting-item fv-setting-row">
              <label for="report-category" data-translate="report-category-label">Issue Category</label>
              <select id="report-category" class="setting-item select" required>
                <option value="" disabled selected data-translate="report-select-placeholder">Select a category…</option>
              </select>
              <p class="report-error-text" id="error-category"></p>
            </div>

            <!-- Problem Details -->
            <div class="setting-item fv-setting-row">
              <label for="report-details" data-translate="report-details-label">Problem Details</label>
              <textarea id="report-details" class="report-textarea" rows="4" required></textarea>
              <p class="report-error-text" id="error-details"></p>
            </div>

            <!-- Expected Behavior (optional) -->
            <div class="setting-item fv-setting-row">
              <label for="report-expected">
                <span data-translate="report-expected-label">Expected Behavior</span>
                <span class="report-optional" data-translate="report-optional">(Optional)</span>
              </label>
              <textarea id="report-expected" class="report-textarea" rows="3"></textarea>
            </div>

            <!-- Page where issue occurred -->
            <div class="setting-item fv-setting-row">
              <label for="report-page" data-translate="report-page-label">Page Where Issue Occurred</label>
              <select id="report-page" class="setting-item select" required>
                <option value="" disabled selected data-translate="report-select-placeholder">Select a page…</option>
              </select>
              <label for="report-page-custom" id="label-report-page-custom" class="fv-sr-only" data-translate="report-page-custom-label">Specific Page or URL</label>
              <input type="text" id="report-page-custom" class="report-textinput report-page-custom" autocomplete="off" />
              <p class="report-error-text" id="error-page"></p>
            </div>

            <!-- Browser -->
            <div class="setting-item fv-setting-row">
              <label for="report-browser" data-translate="report-browser-label">Browser / Device</label>
              <select id="report-browser" class="setting-item select">
                <option value="" disabled selected data-translate="report-select-placeholder">Select a browser…</option>
              </select>
            </div>

            <!-- Contact Email (optional) -->
            <div class="setting-item fv-setting-row">
              <label for="report-email">
                <span data-translate="report-email-label">Your Email</span>
                <span class="report-optional" data-translate="report-optional">(Optional)</span>
              </label>
              <input type="email" id="report-email" class="report-textinput" autocomplete="email" />
            </div>

            <!-- Submit -->
            <div class="fv-setting-row">
              <button type="submit" class="report-submit" id="report-submit" data-translate="report-submit-btn">Submit Report</button>
            </div>

          </form>
        </section>

      </div>
    </main>

    <!-- Footer Landmark -->
    <footer class="fv-footer" role="contentinfo">
      <div id="fv-footer-mount"></div>
    </footer>

  </div><!-- /#fv-app -->

  <script src="/assets/js/back-button.js?v=1.0.0-20250322"></script>
  <script src="/assets/js/lang-core.js?v=1.0.0"></script>
  <script src="/assets/js/language.js?v=1.0.0-20250322"></script>
  <script defer src="/assets/js/footer-template.js?v=1.0.0-20250322"></script>
  <script defer src="/assets/js/popup.js?v=1.0.0-20250322"></script>
  <script defer src="/assets/js/version-core.js?v=1.0.0-20250322"></script>
  <script defer src="/assets/js/lang-links.js?v=1.0.0-20250322"></script>

  <script>
  (function() {
    'use strict';

    /* ══════════════════════════════════════════════
       CONFIG
       ══════════════════════════════════════════════ */
    var API_ENDPOINT = 'https://community-fanhoard.pages.dev/report';
    var VERSION_FALLBACK = '1.6.2_2';

    /* ── Issue categories ── */
    var CATEGORIES = [
      { value: 'bug',            label: { en: '\u{1F41B} Bug',                   th: '\u{1F41B} \u0E1A\u0E31\u0E4A\u0E01' } },
      { value: 'translation',    label: { en: '\u{1F310} Translation Issue',      th: '\u{1F310} \u0E1B\u0E31\u0E0D\u0E2B\u0E32\u0E01\u0E32\u0E23\u0E41\u0E1B\u0E25' } },
      { value: 'broken-link',    label: { en: '\u{1F517} Broken Link',            th: '\u{1F517} \u0E25\u0E34\u0E07\u0E01\u0E4C\u0E40\u0E2A\u0E35\u0E22' } },
      { value: 'mobile-ui',      label: { en: '\u{1F4F1} Mobile UI Issue',        th: '\u{1F4F1} \u0E1B\u0E31\u0E0D\u0E2B\u0E32 UI \u0E1A\u0E19\u0E21\u0E37\u0E2D\u0E16\u0E37\u0E2D' } },
      { value: 'performance',    label: { en: '\u{26A1} Performance Issue',       th: '\u{26A1} \u0E1B\u0E31\u0E0D\u0E2B\u0E32\u0E1B\u0E23\u0E30\u0E2A\u0E34\u0E17\u0E18\u0E34\u0E20\u0E32\u0E1E' } },
      { value: 'incorrect-info', label: { en: '\u{1F4C4} Incorrect Information',  th: '\u{1F4C4} \u0E02\u0E49\u0E2D\u0E21\u0E39\u0E25\u0E44\u0E21\u0E48\u0E16\u0E39\u0E01\u0E15\u0E49\u0E2D\u0E07' } },
      { value: 'suggestion',     label: { en: '\u{1F4A1} Suggestion',             th: '\u{1F4A1} \u0E02\u0E49\u0E2D\u0E40\u0E2A\u0E19\u0E2D\u0E41\u0E19\u0E30' } },
      { value: 'other',          label: { en: '\u{2753} Other',                   th: '\u{2753} \u0E2D\u0E37\u0E48\u0E19\u0E46' } }
    ];

    /* ── Site pages ── */
    var PAGES = [
      { value: '/home/',                label: { en: 'Home',            th: '\u0E2B\u0E19\u0E49\u0E32\u0E2B\u0E25\u0E31\u0E01' } },
      { value: '/platform/about/',      label: { en: 'About',           th: '\u0E40\u0E01\u0E35\u0E48\u0E22\u0E27\u0E01\u0E31\u0E1A' } },
      { value: '/platform/whats_new/',  label: { en: "What's New",      th: '\u0E2D\u0E30\u0E44\u0E23\u0E43\u0E2B\u0E21\u0E48' } },
      { value: '/platform/roadmap/',    label: { en: 'Roadmap',         th: '\u0E41\u0E1C\u0E19\u0E07\u0E32\u0E19' } },
      { value: '/platform/privacy/',    label: { en: 'Privacy Policy',  th: '\u0E19\u0E42\u0E22\u0E1A\u0E32\u0E22\u0E04\u0E27\u0E32\u0E21\u0E40\u0E1B\u0E47\u0E19\u0E2A\u0E48\u0E27\u0E19\u0E15\u0E31\u0E27' } },
      { value: '/platform/license/',    label: { en: 'Content License', th: '\u0E2A\u0E31\u0E0D\u0E0D\u0E32\u0E2D\u0E19\u0E38\u0E0D\u0E32\u0E15\u0E40\u0E19\u0E37\u0E49\u0E2D\u0E2B\u0E32' } },
      { value: '/community/contact/',   label: { en: 'Contact',         th: '\u0E15\u0E34\u0E14\u0E15\u0E48\u0E2D' } },
      { value: '/data/verse/discover/', label: { en: 'Verse Discover',  th: 'Verse \u0E04\u0E49\u0E19\u0E1E\u0E1A' } },
      { value: '/data/verse/scope/',    label: { en: 'Verse Scope',     th: 'Verse \u0E02\u0E2D\u0E1A\u0E40\u0E02\u0E15' } },
      { value: '/setting/',             label: { en: 'Settings',        th: '\u0E15\u0E31\u0E49\u0E07\u0E04\u0E48\u0E32' } },
      { value: '/search/',              label: { en: 'Search',          th: '\u0E04\u0E49\u0E19\u0E2B\u0E32' } },
      { value: 'other',                 label: { en: 'Other Page (Enter URL below)', th: '\u0E2B\u0E19\u0E49\u0E32\u0E2D\u0E37\u0E48\u0E19\u0E46 (\u0E23\u0E30\u0E1A\u0E38 URL \u0E14\u0E49\u0E22\u0E19\u0E25\u0E48\u0E32\u0E07)' } }
    ];

    /* ── Common Browsers ── */
    var BROWSERS = [
      { value: 'chrome-desktop',  label: 'Chrome (Desktop)' },
      { value: 'chrome-android',  label: 'Chrome (Android)' },
      { value: 'safari-iOS',      label: 'Safari (iPhone/iPad)' },
      { value: 'safari-mac',      label: 'Safari (Mac)' },
      { value: 'firefox-desktop', label: 'Firefox (Desktop)' },
      { value: 'edge-desktop',    label: 'Edge (Desktop)' },
      { value: 'samsung-internet',label: 'Samsung Internet' },
      { value: 'opera',           label: 'Opera' },
      { value: 'brave',           label: 'Brave' },
      { value: 'other',           label: 'Other / Not Listed' }
    ];

    /* ══════════════════════════════════════════════
       STATE & TRANSLATIONS
       ══════════════════════════════════════════════ */
    var currentLang = 'en';
    var appVersion = VERSION_FALLBACK;

    function getTranslations() {
      if (currentLang === 'th') {
        return {
          placeholder: 'กรุณาเลือก…',
          submitting: 'กำลังส่งรายงาน…',
          submitBtn: 'ส่งรายงาน',
          successTitle: 'ส่งรายงานสำเร็จ',
          successBody: 'ขอบคุณสำหรับข้อมูล ทีมงานจะนำไปปรับปรุง FanHoard ให้ดียิ่งขึ้น',
          errorTitle: 'เกิดข้อผิดพลาด',
          errorBody: 'ไม่สามารถส่งรายงานได้ กรุณาลองใหม่อีกครั้งในภายหลัง',
          errCategory: 'กรุณาเลือกประเภทปัญหา',
          errDetails: 'กรุณาระบุรายละเอียดปัญหา',
          errPage: 'กรุณาเลือกหน้าที่พบปัญหา'
        };
      }
      return {
        placeholder: 'Select an option…',
        submitting: 'Submitting report…',
        submitBtn: 'Submit Report',
        successTitle: 'Report Submitted',
        successBody: 'Thank you for your feedback! We will review your report to help improve FanHoard.',
        errorTitle: 'Submission Error',
        errorBody: 'Failed to submit report. Please try again later.',
        errCategory: 'Please select an issue category',
        errDetails: 'Please describe the problem',
        errPage: 'Please select the page where the issue occurred'
      };
    }

    /* ══════════════════════════════════════════════
       POPULATE DROPDOWNS
       ══════════════════════════════════════════════ */

    function populateSelect(selectEl, items, selectedVal) {
      var t = getTranslations();
      selectEl.innerHTML = '';

      var placeholderOpt = document.createElement('option');
      placeholderOpt.value = '';
      placeholderOpt.disabled = true;
      placeholderOpt.selected = !selectedVal;
      placeholderOpt.textContent = t.placeholder;
      selectEl.appendChild(placeholderOpt);

      items.forEach(function(item) {
        var opt = document.createElement('option');
        opt.value = item.value;
        opt.textContent = typeof item.label === 'object'
          ? (item.label[currentLang] || item.label.en)
          : item.label;
        if (selectedVal && selectedVal === item.value) {
          opt.selected = true;
        }
        selectEl.appendChild(opt);
      });
    }

    function updateDropdowns() {
      var catSel = document.getElementById('report-category');
      var pageSel = document.getElementById('report-page');
      var browserSel = document.getElementById('report-browser');

      var catVal = catSel.value;
      var pageVal = pageSel.value;
      var browserVal = browserSel.value;

      populateSelect(catSel, CATEGORIES, catVal);
      populateSelect(pageSel, PAGES, pageVal);
      populateSelect(browserSel, BROWSERS, browserVal);
    }

    /* ══════════════════════════════════════════════
       VERSION DETECTION
       ══════════════════════════════════════════════ */

    async function fetchVersion() {
      try {
        var resp = await fetch('/assets/json/version.json');
        if (resp.ok) {
          var json = await resp.json();
          if (json && json.version) {
            appVersion = json.version;
          }
        }
      } catch (_) {
        // Fallback version is pre-set
      }
    }

    /* ══════════════════════════════════════════════
       FORM HANDLERS
       ══════════════════════════════════════════════ */

    function handlePageSelect() {
      var pageSel = document.getElementById('report-page');
      var customInput = document.getElementById('report-page-custom');
      var customLabel = document.getElementById('label-report-page-custom');
      if (pageSel.value === 'other') {
        customInput.classList.add('visible');
        customInput.required = true;
        if (customLabel) customLabel.classList.remove('fv-sr-only');
        customInput.focus();
      } else {
        customInput.classList.remove('visible');
        customInput.required = false;
        if (customLabel) customLabel.classList.add('fv-sr-only');
        customInput.value = '';
      }
      clearError('page');
    }

    function setError(fieldId, errorTextId, message) {
      var inputEl = document.getElementById('report-' + fieldId);
      var errEl = document.getElementById('error-' + fieldId);
      if (inputEl) inputEl.classList.add('report-field-error');
      if (errEl) {
        errEl.textContent = message;
        errEl.classList.add('visible');
      }
    }

    function clearError(fieldId) {
      var inputEl = document.getElementById('report-' + fieldId);
      var errEl = document.getElementById('error-' + fieldId);
      if (inputEl) inputEl.classList.remove('report-field-error');
      if (errEl) {
        errEl.textContent = '';
        errEl.classList.remove('visible');
      }
    }

    function clearAllErrors() {
      ['category', 'details', 'page'].forEach(clearError);
    }

    function validateForm() {
      clearAllErrors();
      var isValid = true;
      var t = getTranslations();

      var category = document.getElementById('report-category').value;
      if (!category) {
        setError('category', 'error-category', t.errCategory);
        isValid = false;
      }

      var details = document.getElementById('report-details').value.trim();
      if (!details) {
        setError('details', 'error-details', t.errDetails);
        isValid = false;
      }

      var page = document.getElementById('report-page').value;
      if (!page) {
        setError('page', 'error-page', t.errPage);
        isValid = false;
      } else if (page === 'other') {
        var customPage = document.getElementById('report-page-custom').value.trim();
        if (!customPage) {
          setError('page', 'error-page', t.errPage);
          isValid = false;
        }
      }

      if (!isValid) {
        var firstErr = document.querySelector('.report-field-error');
        if (firstErr) firstErr.focus();
      }

      return isValid;
    }

    function getFormData() {
      var pageVal = document.getElementById('report-page').value;
      if (pageVal === 'other') {
        pageVal = document.getElementById('report-page-custom').value.trim();
      }

      return {
        category:         document.getElementById('report-category').value,
        details:          document.getElementById('report-details').value.trim(),
        expectedBehavior: document.getElementById('report-expected').value.trim() || undefined,
        pageUrl:          pageVal,
        browser:          document.getElementById('report-browser').value || undefined,
        userEmail:        document.getElementById('report-email').value.trim() || undefined,
        userAgent:        navigator.userAgent,
        appVersion:       appVersion,
        submittedLang:    currentLang,
        timestamp:        new Date().toISOString()
      };
    }

    function setSubmitLoading(loading) {
      var btn = document.getElementById('report-submit');
      var t = getTranslations();
      if (loading) {
        btn.disabled = true;
        btn.textContent = t.submitting;
      } else {
        btn.disabled = false;
        btn.textContent = t.submitBtn;
      }
    }

    function showPopup(title, body) {
      if (window.PopupSystem && window.PopupSystem.open) {
        PopupSystem.open({
          title: title,
          body: '<p style="text-align:center;margin:0;">' + body + '</p>',
          size: 'sm',
          showHeader: true,
          hideOnBack: true
        });
      } else {
        alert(title + '\n' + body);
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      if (!validateForm()) return;

      var t = getTranslations();
      setSubmitLoading(true);
      if (window.announceToScreenReader) {
        window.announceToScreenReader(currentLang === "th" ? "กำลังส่งรายงาน…" : "Submitting report…", "polite");
      }

      var data = getFormData();

      try {
        var resp = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (!resp.ok) {
          var errData = {};
          try { errData = await resp.json(); } catch (_) {}
          throw new Error(errData.error || 'HTTP ' + resp.status);
        }

        document.getElementById('report-form').reset();
        updateDropdowns();
        if (window.announceToScreenReader) {
          window.announceToScreenReader(currentLang === "th" ? "ส่งรายงานสำเร็จเรียบร้อยแล้ว" : "Report submitted successfully.", "polite");
        }
        showPopup(t.successTitle, t.successBody);
      } catch (err) {
        console.error('[report] Submit failed:', err);
        if (window.announceToScreenReader) {
          window.announceToScreenReader(currentLang === "th" ? "เกิดข้อผิดพลาดในการส่งรายงาน" : "Failed to submit report.", "assertive");
        }
        showPopup(t.errorTitle, t.errorBody);
      } finally {
        setSubmitLoading(false);
      }
    }

    /* ══════════════════════════════════════════════
       LANGUAGE CHANGE HANDLER
       ══════════════════════════════════════════════ */

    function onLangChange() {
      if (window.FvLang) {
        currentLang = window.FvLang.lang || 'en';
      }
      updateDropdowns();
    }

    /* ══════════════════════════════════════════════
       INIT
       ══════════════════════════════════════════════ */

    function init() {
      if (window.FvLang) {
        currentLang = window.FvLang.lang || 'en';
      }

      updateDropdowns();

      document.getElementById('report-page').addEventListener('change', handlePageSelect);
      document.getElementById('report-form').addEventListener('submit', handleSubmit);

      document.addEventListener('fv:langchange', onLangChange);
      if (window.FvLang && window.FvLang.onChange) {
        window.FvLang.onChange(onLangChange);
      }

      fetchVersion();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>

</body>
</html>
