<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <script src="assets/js/lang-proxy.js?v=2.3.0-202609220313"></script>
    
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-translate="contact-other-title">Contact Us</title>

    <!-- Preload & Fallback for critical CSS -->
    <link rel="preload" href="/assets/css/tokens.css" as="style">
    <link rel="stylesheet" href="/assets/css/tokens.css">

    <link rel="preload" href="/assets/css/setting.css?v=2.3.0-202609220313" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/assets/css/setting.css?v=2.3.0-202609220313"></noscript>

    <link rel="preload" href="/assets/css/bg.css?v=2.3.0-202609220313" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/assets/css/bg.css?v=2.3.0-202609220313"></noscript>

    <!-- Other CSS -->
    <link rel="stylesheet" href="/assets/css/top-navigation-bar.css?v=2.3.0-202609220313" media="all" />
    <link rel="stylesheet" href="/assets/css/report.css?v=2.3.0-202609220313" media="all" />

    <link rel="icon" type="image/x-icon" href="/assets/images/fanhoard-verse360.ico" />
</head>
<body>

    <a href="#fv-main" class="skip-link fv-skip-link">Skip to main content</a>

    <div id="fv-app" class="fv-app fv-page-shell" data-page="contact">

        <!-- Navigation Bar Header -->
        <header class="fv-header" role="banner">
            <nav class="fv-nav" role="navigation" aria-label="Page navigation">
                <button class="back-button" id="back-button" aria-label="Go back">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="m15 19-7-7 7-7" />
                    </svg>
                </button>
                <span class="page-title" data-translate="page-contact">Contact</span>
            </nav>
        </header>

        <!-- Main Landmark -->
        <main id="fv-main" class="fv-main" role="main" tabindex="-1">
            <div class="container-md stack-md">
                <section class="fv-section fv-card con">
                    <h1 class="fv-section-label" data-translate="contact-other-title">Contact Us</h1>
                    <p class="fv-section-desc" data-translate="contact-other-desc">If you have any questions or feedback, please reach out using one of the contact options below.</p>
                </section>

                <div class="fv-setting-group contact-options-group">
                    <div class="setting-item fv-setting-row">
                        <label for="contact-method" data-translate="contact-method-label">Contact Method</label>
                        <section>
                            <select id="contact-method" class="setting-item select">
                                <option value="gmail" data-translate="contact-method-gmail">Gmail</option>
                                <option value="form" data-translate="contact-method-form">Google Form</option>
                            </select>
                        </section>
                    </div>

                    <div class="setting-item fv-setting-row" id="contact-form-section" style="display:none;">
                        <label for="contact-form-lang" data-translate="contact-form-lang-label">Select Form Language</label>
                        <section class="contact-action-box">
                            <select id="contact-form-lang" class="setting-item select m5">
                                <!-- Dynamic options populated by JS -->
                            </select>
                            <button class="contact-action-btn" id="goto-form-btn">Go to Contact Form</button>
                        </section>
                    </div>

                    <div class="setting-item fv-setting-row" id="gmail-section">
                        <label for="goto-gmail-btn" data-translate="contact-gmail-text">Email Support</label>
                        <section class="contact-action-box">
                            <button id="goto-gmail-btn" onclick="window.location.href='mailto:fanhoard.official@gmail.com'" class="contact-action-btn" data-translate="contact-gmail-btn">
                                <svg
                                  xmlns="http://www.w3.org/2000/svg"
                                  width="20"
                                  height="20"
                                  viewBox="0 0 24 24"
                                  fill="none"
                                  stroke="currentColor"
                                  stroke-width="1.5"
                                  stroke-linecap="round"
                                  stroke-linejoin="round"
                                  aria-hidden="true"
                                  focusable="false"
                                >
                                  <path d="M10 14l11 -11" />
                                  <path d="M21 3l-6.5 18a.55 .55 0 0 1 -1 0l-3.5 -7l-7 -3.5a.55 .55 0 0 1 0 -1l18 -6.5" />
                                </svg>
                            </button>
                        </section>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer Landmark -->
        <footer class="fv-footer" role="contentinfo">
            <div id="fv-footer-mount"></div>
        </footer>

    </div><!-- /#fv-app -->

    <!-- JS: Language loader -->
    <script src="/assets/js/lang-core.js?v=2.3.0-202609220313"></script>
    <script src="/assets/js/language.js?v=2.3.0-202609220313"></script>
    <!-- Deferred JS -->
    <script defer src="/assets/js/popup.js?v=2.3.0-202609220313"></script>
    <script defer src="/assets/js/version-core.js?v=2.3.0-202609220313"></script>
  <script defer src="/assets/js/reload-top.js?v=2.3.0-202609220313"></script>
    <script defer src="/assets/js/footer-template.js?v=2.3.0-202609220313"></script>
    <script defer src="/assets/js/back-button.js?v=2.3.0-202609220313"></script>

    <script>
    // URLs for Google Forms by language
    const contactFormUrls = {
        en: "https://docs.google.com/forms/d/e/1FAIpQLSe_en_contact_form_url/viewform",
        th: "https://docs.google.com/forms/d/e/1FAIpQLSe_th_contact_form_url/viewform"
    };

    // Button label text by language
    const contactFormBtnText = {
        en: "Go to Contact Form",
        th: "ไปที่แบบฟอร์มติดต่อ",
        default: "Go to Contact Form"
    };

    async function loadLangOptions() {
        const langSelect = document.getElementById('contact-form-lang');
        langSelect.innerHTML = '';
        let langs = {};
        try {
            let localConfigRaw = localStorage.getItem('__lang_cfg');
            if(localConfigRaw) {
                langs = JSON.parse(localConfigRaw);
            } else {
                const resp = await fetch('/assets/json/language.json');
                langs = await resp.json();
            }
        } catch(e) {
            console.warn("Error loading languages:", e);
        }
        Object.entries(langs).forEach(([code, data]) => {
            const option = document.createElement('option');
            option.value = code;
            option.textContent = data.label;
            langSelect.appendChild(option);
        });
        const selectedLang = localStorage.getItem('selectedLang');
        if(selectedLang && langSelect.querySelector(`option[value="${selectedLang}"]`)) {
            langSelect.value = selectedLang;
        }
        updateGotoFormBtnText();
    }

    function updateContactMethod() {
        const val = document.getElementById('contact-method').value;
        document.getElementById('contact-form-section').style.display = val === 'form' ? '' : 'none';
        document.getElementById('gmail-section').style.display = val === 'gmail' ? '' : 'none';
    }

    function updateGotoFormBtnText() {
        const lang = document.getElementById('contact-form-lang').value;
        const btn = document.getElementById('goto-form-btn');
        btn.textContent = contactFormBtnText[lang] || contactFormBtnText.default;
    }

    document.getElementById('contact-form-lang').addEventListener('change', updateGotoFormBtnText);

    document.getElementById('goto-form-btn').addEventListener('click', () => {
        const lang = document.getElementById('contact-form-lang').value;
        const url = contactFormUrls[lang] || contactFormUrls['en'];
        window.open(url, '_blank');
    });

    document.getElementById('contact-method').addEventListener('change', updateContactMethod);

    document.addEventListener('DOMContentLoaded', () => {
        loadLangOptions();
        updateContactMethod();
    });
    </script>

    <script defer src="/assets/js/lang-links.js?v=2.3.0-202609220313"></script>
</body>
</html>
