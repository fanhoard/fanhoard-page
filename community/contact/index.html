<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <script src="assets/js/lang-proxy.js?v=1.0.0-20250322"></script>
    
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-translate="contact-other-title">Contact Us</title>

    <!-- Preload & Fallback for critical CSS -->
    <link rel="preload" href="/assets/css/tokens.css" as="style">
    <link rel="stylesheet" href="/assets/css/tokens.css">

    <link rel="preload" href="/assets/css/setting.css?v=1.0.0-20250322" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/assets/css/setting.css?v=1.0.0-20250322"></noscript>

    <link rel="preload" href="/assets/css/bg.css?v=1.0.0-20250322" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/assets/css/bg.css?v=1.0.0-20250322"></noscript>

    <!-- Other CSS -->
    <link rel="stylesheet" href="/assets/css/top-navigation-bar.css?v=1.0.0-20250322" media="all" />

    <link rel="icon" type="image/x-icon" href="/assets/images/fanhoard-verse360.ico" />
</head>
<body>

    <a href="#main" class="skip-link fv-skip-link">Skip to main content</a>

    <!-- Navigation Bar -->
    <nav aria-label="Page navigation">
        <button class="back-button" id="back-button" aria-label="Go back">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 19-7-7 7-7" />
            </svg>
        </button>
        <span class="page-title" data-translate="page-contact">Contact</span>
    </nav>

    <main id="main" class="fv-main">
        <section class="con">
            <h1 class="fv-section-label" data-translate="contact-other-title">Contact Us</h1>
            <p class="fv-section-desc" data-translate="contact-other-desc">If you have any questions or feedback, please reach out using one of the contact options below.</p>
        </section>

        <div class="pad">
            <div class="setting-item">
                <label for="contact-method" data-translate="contact-method-label">Contact Method</label>
                <section>
                    <select id="contact-method" class="setting-item select">
                        <option value="gmail" data-translate="contact-method-gmail">Gmail</option>
                        <option value="form" data-translate="contact-method-form">Google Form</option>
                    </select>
                </section>
            </div>

            <div class="setting-item" id="contact-form-section" style="display:none;">
                <label for="contact-form-lang" data-translate="contact-form-lang-label">Select Form Language</label>
                <section>
                    <select id="contact-form-lang" class="setting-item select m5">
                        <!-- Dynamic options populated by JS -->
                    </select>
                    <button class="buttons tap" id="goto-form-btn">Go to Contact Form</button>
                </section>
            </div>

            <div class="setting-item" id="gmail-section">
                <label for="goto-gmail-btn" data-translate="contact-gmail-text">Email Support</label>
                <section>
                    <button id="goto-gmail-btn" onclick="window.location.href='mailto:fanhoard.official@gmail.com'" class="buttons tap" data-translate="contact-gmail-btn">
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          width="24"
                          height="24"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="1.25"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          aria-hidden="true"
                        >
                          <path d="M10 14l11 -11" />
                          <path d="M21 3l-6.5 18a.55 .55 0 0 1 -1 0l-3.5 -7l-7 -3.5a.55 .55 0 0 1 0 -1l18 -6.5" />
                        </svg>
                    </button>
                </section>
            </div>
        </div>
    </main>

    <!-- JS: Language loader -->
    <script src="/assets/js/lang-core.js?v=1.0.0"></script>
    <script src="/assets/js/language.js?v=1.0.0-20250322"></script>
    <!-- Deferred JS -->
    <script defer src="/assets/js/popup.js?v=1.0.0-20250322"></script>
    <script defer src="/assets/js/version-core.js?v=1.0.0-20250322"></script>
    <script defer src="/assets/js/footer-template.js?v=1.0.0-20250322"></script>
    <script defer src="/assets/js/back-button.js?v=1.0.0-20250322"></script>

    <script>
    // URLs for Google Forms by language
    const contactFormUrls = {
        en: "https://docs.google.com/forms/d/e/1FAIpQLSe_en_contact_form_url/viewform",
        th: "https://docs.google.com/forms/d/e/1FAIpQLSe_th_contact_form_url/viewform"
    };

    // Button label text by language
    const contactFormBtnText = {
        en: "Go to Contact Form",
        th: "ไปที่แบบฟอร์มติดต่อ",
        default: "Go to Contact Form"
    };

    async function loadLangOptions() {
        const langSelect = document.getElementById('contact-form-lang');
        langSelect.innerHTML = '';
        let langs = {};
        try {
            let localConfigRaw = localStorage.getItem('__lang_cfg');
            if(localConfigRaw) {
                langs = JSON.parse(localConfigRaw);
            } else {
                const resp = await fetch('/assets/json/language.json');
                langs = await resp.json();
            }
        } catch(e) {
            console.warn("Error loading languages:", e);
        }
        Object.entries(langs).forEach(([code, data]) => {
            const option = document.createElement('option');
            option.value = code;
            option.textContent = data.label;
            langSelect.appendChild(option);
        });
        const selectedLang = localStorage.getItem('selectedLang');
        if(selectedLang && langSelect.querySelector(`option[value="${selectedLang}"]`)) {
            langSelect.value = selectedLang;
        }
        updateGotoFormBtnText();
    }

    function updateContactMethod() {
        const val = document.getElementById('contact-method').value;
        document.getElementById('contact-form-section').style.display = val === 'form' ? '' : 'none';
        document.getElementById('gmail-section').style.display = val === 'gmail' ? '' : 'none';
    }

    function updateGotoFormBtnText() {
        const lang = document.getElementById('contact-form-lang').value;
        const btn = document.getElementById('goto-form-btn');
        btn.textContent = contactFormBtnText[lang] || contactFormBtnText.default;
    }

    document.getElementById('contact-form-lang').addEventListener('change', updateGotoFormBtnText);

    document.getElementById('goto-form-btn').addEventListener('click', () => {
        const lang = document.getElementById('contact-form-lang').value;
        const url = contactFormUrls[lang] || contactFormUrls['en'];
        window.open(url, '_blank');
    });

    document.getElementById('contact-method').addEventListener('change', updateContactMethod);

    document.addEventListener('DOMContentLoaded', () => {
        loadLangOptions();
        updateContactMethod();
    });
    </script>

    <script defer src="/assets/js/lang-links.js?v=1.0.0-20250322"></script>
</body>
</html>
