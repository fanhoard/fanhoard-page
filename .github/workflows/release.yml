# .github/workflows/release.yml — Layer 3: CI validation + build + deploy
# 4-layer version control system for FanHoard
#
# Workflow (Release Ledger — docs/adr/0001-release-ledger.md):
#   1. Validate (validate-release.js --ci)
#   2. Build Ledger (build-ledger.js — สร้าง manifest จาก Ledger ใน repo)
#      + Cache-bust (update-version.js)
#   3. Cloudflare Pages deploy และสร้าง artifact ด้วย npm run build เอง
#      (build-ledger รันใน build ทุกครั้ง — manifest ถูกต้องเสมอโดยไม่ต้อง commit กลับ)
#
# ถ้า validate ไม่ผ่าน → deploy ไม่ทำงาน
# v7: ยกเลิก Layer 3.4 commit-back (ต้นเหตุทำให้ manifest กับ Ledger ไม่ตรงกันและ deploy ค้าง [skip ci])

name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  deployments: write

jobs:
  validate:
    name: Layer 3 — Validate + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ต้องการ full history สำหรับ git log

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Layer 3.1 — Validate release (CI mode)
        run: |
          echo "🔍  Layer 3.1: CI validation..."
          node scripts/validate-release.js --ci --allow-generated
          echo "✅  Layer 3.1 PASSED"

      - name: Layer 3.2 — Build (update-version.js)
        run: |
          echo "📦  Layer 3.2: Building release artifacts..."
          # v7: สร้าง manifest จาก Ledger (releases/v*.md) แล้ว cache-bust
          #     Released At ถูกประทับโดย pre-commit hook แล้ว ที่นี่ไม่แตะเวลา
          node scripts/build-ledger.js
          node scripts/update-version.js
          echo "✅  Layer 3.2 PASSED"

      - name: Layer 3.3 — Verify build artifacts
        run: |
          echo "🔎  Layer 3.3: Verifying build artifacts..."
          # v6.2: ตรวจ path ให้ตรงกับโครงสร้าง per-language releases/ ของ update-version.js v6.1+
          # (เดิมเช็ค path เก่า assets/md/releases/ และ release-dates.json ที่ไม่ถูกสร้างแล้ว
          #  ทำให้ step นี้ fail เสมอ และ history ไม่เคยถูก commit/deploy)
          test -f assets/md/en/releases/index.json || { echo "❌  ไม่พบ assets/md/en/releases/index.json"; exit 1; }
          test -f assets/md/th/releases/index.json || { echo "❌  ไม่พบ assets/md/th/releases/index.json"; exit 1; }
          test -f assets/json/version.json || { echo "❌  ไม่พบ version.json"; exit 1; }
          # ตรวว่า version.json มี version ที่ถูกต้อง
          VERSION=$(node -e "console.log(require('./assets/json/version.json').version)")
          if [ -z "$VERSION" ]; then
            echo "❌  version.json ไม่มี version"
            exit 1
          fi
          echo "   Version: $VERSION"
          echo "✅  Layer 3.3 PASSED"

# ── Layer 4 (Deploy to Cloudflare Pages) — ถูกถอดออก ─────────────────────────
# Production deploy ทำผ่าน Cloudflare Pages Git Integration ของ project
# "fanhoard" โดยตรง (build และ publish ทุกครั้งที่ main push) — job นี้ซ้ำซ้อน
# และอ้าง action `cloudflare/pages-action@v1` ที่ resolve ไม่ได้ (ref ไม่มีจริง)
# จึงล้มทุก run ตั้งแต่ 2026-09-20 โดยไม่กระทบการ deploy จริง
