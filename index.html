  <!--
    [FIX 2026-07-28 v2]
    ไฟล์นี้เป็น CUSTOM 404 PAGE ของ FanHoard — ใช้สำหรับทุก URL ที่ไม่มี
    หน้าจริง (รวมถึง /, /index.html, และ path อื่นๆ ที่ไม่ match กับ
    _redirects rules ใดๆ)

    วิธีการทำงาน (production):
      Cloudflare Pages _redirects rule สุดท้าย:
        /* /index.html 404
      จะส่ง HTTP 404 status พร้อม content ของ index.html นี้ออกไป
      → browser ไม่ขึ้น default 404 page เอง
      → ระบบเราควบคุม UX ของ 404 page ทั้งหมด
      → Google ไม่ index หน้านี้ (เพราะ noindex + 404 status)
      → ไม่ใช่ "Page with redirect" → แก้ปัญหา GSC indexing

    ห้ามใส่:
      - lang-proxy.js (จะทำให้เกิด JS redirect ซ้ำ → Google เห็นเป็น redirect)
      - meta refresh (จะทำให้ Google มองเป็น redirect ด้วย)
      - canonical / hreflang (เป็น 404 ไม่ควรมี canonical)
      - "index, follow" (ต้องเป็น noindex เพราะเป็น 404)
  -->
